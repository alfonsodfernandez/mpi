# ==============================================================================
# Configuración Nginx para VPS (Ubuntu/Debian) con Reverse Proxy + HTTPS (Certbot)
# Sustituye "mpi.tudominio.com" por tu dominio real antes de activar el sitio.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name mpi.tudominio.com;

    # Permitir validación HTTP-01 de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo el tráfico HTTP a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mpi.tudominio.com;

    # Certificados generados por Certbot (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/mpi.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mpi.tudominio.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MPI_SSL:10m;

    # Cabeceras de seguridad HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión Gzip para carga ultrarrápida
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 5M;

    # Caché agresiva para assets con hash de Vite
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy inverso hacia el contenedor Docker (FastAPI + SPA)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Reenvío de la IP pública real de Pablo para auditoría en /admin
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
